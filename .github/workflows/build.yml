name: Build DUMDUM

on:
  push:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows
            extension: .exe

          - os: macos-15-intel
            name: macos-intel
            extension: ""

          - os: macos-latest
            name: macos-arm64
            extension: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install PyInstaller
        run: python -m pip install pyinstaller

      - name: Build
        run: >
          python -m PyInstaller
          --onefile
          --clean
          --name DUMDUM
          main.py

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: DUMDUM-${{ matrix.name }}
          path: dist/DUMDUM${{ matrix.extension }}
